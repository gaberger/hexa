[package]
name = "hexa-infer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Inference for hexa — IInferencePort adapters, with no daemon between the agent and the model"

[dependencies]
sha2 = "0.11"
hexa-core = { path = "../hexa-core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
