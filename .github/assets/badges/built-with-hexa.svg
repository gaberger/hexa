<svg xmlns="http://www.w3.org/2000/svg" width="132" height="20" viewBox="0 0 132 20" role="img" aria-label="built with: hexa">
  <title>built with: hexa</title>
  <defs>
    <linearGradient id="hexa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <clipPath id="hexa-round"><rect width="132" height="20" rx="3"/></clipPath>
  </defs>
  <g clip-path="url(#hexa-round)">
    <rect width="86" height="20" fill="#0d1117"/>
    <rect x="86" width="46" height="20" fill="url(#hexa-grad)"/>
  </g>
  <rect x=".5" y=".5" width="131" height="19" rx="2.5" fill="none" stroke="#30363d"/>
  <!-- the hexa mark: boundary hexagon around a filled core -->
  <polygon points="13,3.5 19,7 19,13 13,16.5 7,13 7,7" fill="none" stroke="url(#hexa-grad)" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="13,7.6 15.6,9.1 15.6,11.9 13,13.4 10.4,11.9 10.4,9.1" fill="url(#hexa-grad)"/>
  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" text-rendering="geometricPrecision">
    <text x="25" y="14" fill="#c9d1d9" textLength="55" lengthAdjust="spacingAndGlyphs">built with</text>
    <text x="109" y="15" fill="#010409" fill-opacity=".3" text-anchor="middle" font-weight="bold">hexa</text>
    <text x="109" y="14" fill="#ffffff" text-anchor="middle" font-weight="bold">hexa</text>
  </g>
</svg>
