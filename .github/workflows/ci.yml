name: CI

# Two gates, the same two hexa asks of every project: the suite exits 0,
# and the architecture grade holds. hexa is graded by the binary this
# commit builds.

# ADR-2609132158: hexa's own workflow puts work on `adr/*` branches, and until
# this they met no gate until merge — so a commit there could claim a CI result
# that was never scheduled, and d4b6ee9 did. The pull_request trigger stays on
# `main` alone, or a branch with an open PR would run the same job twice.
on:
  push:
    branches: [main, 'adr/**']
  pull_request:
    branches: [main]

# A newer push on the same branch makes the older run's answer moot;
# cancel it rather than run two five-minute builds side by side.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The TypeScript scaffold's gate is `npm install && npm test`, and it
      # shipped broken because nothing ran it: `node --test <dir>` stopped
      # discovering tests and started trying to load the directory as a
      # module. Pin the runtime the scaffold declares (`engines.node >= 22`)
      # so this job tests what a user gets, not whatever the image ships.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: cargo build --workspace --release --locked
      # HEXA_TEST_NPM lets the TypeScript scaffold gate reach the network for
      # its one `npm install`. Off by default — a test that silently reaches
      # the network is a coin flip — and on here, where the network exists.
      # ADR-2609132158: a gate that never runs on the branch is not a gate.
      - name: Test
        run: cargo test --workspace --release --locked
        env:
          HEXA_TEST_NPM: 1
      # Structural gates before the style one. A failing step stops the job,
      # so with Lint first a clippy idiom warning skipped the architecture
      # grade and the asset check — and did, on v26.9.7 and v26.9.8, which
      # shipped with the A+ floor never verified. A grade regression must
      # not be able to hide behind a lint nit.
      - name: Architecture grade
        run: ./target/release/hexa analyze . --grade A+ --exit-code
      # Syncing must be a no-op on a clean checkout. It was not: every run
      # appended another copy of every hook.
      - name: Installed assets are in sync
        run: ./target/release/hexa assets sync --dry-run | grep -q 'Everything up to date'
      # `hexa dev test lint` denies warnings and had been red since this
      # repository began, because nothing here ran it (ADR-2609122048).
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
