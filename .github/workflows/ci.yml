name: CI

# Two gates, the same two hexa asks of every project: the suite exits 0,
# and the architecture grade holds. hexa is graded by the binary this
# commit builds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release --locked
      - name: Test
        run: cargo test --workspace --release --locked
      - name: Architecture grade
        run: ./target/release/hexa analyze . --grade A+ --exit-code
