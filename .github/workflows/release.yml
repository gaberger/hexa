name: Release

# A tag v<YY.M.patch> builds hexa for four targets and publishes one tarball
# per target, named the way `hexa self-update` and install.sh expect:
# hexa-<version>-<target>.tar.gz containing the single binary `hexa`, plus
# SHA256SUMS.txt. The tag must match the version in Cargo.toml, or the run
# fails before it builds anything: a release that says one version and
# reports another from `hexa --version` is worse than no release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\([^"]*\)".*/\1/')
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            TAG="${GIT_REF#refs/tags/}"
            if [[ "${TAG#v}" != "$CARGO_VER" ]]; then
              echo "::error::tag $TAG does not match Cargo.toml version $CARGO_VER"
              exit 1
            fi
          else
            TAG="v${CARGO_VER}"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build hexa
        run: cargo build --release --locked --target "$TARGET" -p hexa-cli
      - name: Check the binary reports the release version
        run: |
          GOT=$(target/$TARGET/release/hexa --version | awk '{print $2}')
          [[ "$GOT" == "$VERSION" ]] || { echo "::error::binary says $GOT, release is $VERSION"; exit 1; }
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'aarch64-unknown-linux-gnu'
      - name: Tarball
        run: tar czf "hexa-${VERSION}-${TARGET}.tar.gz" -C "target/${TARGET}/release" hexa
      - uses: actions/upload-artifact@v4
        with:
          name: hexa-${{ matrix.target }}
          path: hexa-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz
          retention-days: 7

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/gaberger/hexa/${TAG}/install.sh | bash"
            echo '```'
            echo
            echo "Already installed: \`hexa self-update\`."
            echo
            echo "Each tarball holds the one binary, \`hexa\`, for its target; SHA256SUMS.txt covers all four."
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: hexa ${{ needs.version.outputs.tag }}
          body_path: notes.md
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
