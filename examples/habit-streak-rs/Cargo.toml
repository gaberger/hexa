[package]
name = "habit-streak"
version = "0.1.0"
edition = "2021"

# Stand alone even when scaffolded inside another cargo workspace.
#
# Without this, `cargo` walks up, finds the enclosing workspace, and refuses to
# build: "current package believes it's in a workspace when it's not". The
# scaffold's own gate caught this the first time `hexa scaffold --lang rust` ran
# inside this repository — a skeleton that cannot run is the thing the gate
# exists to prevent, and it would have failed for every user who scaffolds into
# a monorepo.
[workspace]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[[bin]]
name = "habit-streak"
path = "src/main.rs"
