[workspace]
members = [
    "hexa-analysis",
    "hexa-cli",
    "hexa-core",
    "hexa-exec",
    "hexa-git",
    "hexa-graph",
    "hexa-infer",
]
exclude = [
]
resolver = "2"

[workspace.package]
version = "26.11.5"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# CI's build and test profile: release code without the link-time work that
# only makes the shipped binary small. Fat LTO with one codegen unit was
# applied to all ~105 test binaries; measured on 2026-11-08, a rebuild after
# touching hexa-core took 64s that way and 19s this way. Release binaries
# still come from `release` (release.yml).
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

[profile.dev]
opt-level = 0
debug = 1                   # line tables only (not full debug info) — cuts link time

[profile.dev.package."*"]
opt-level = 3               # optimize dependencies at max, keep our code fast-to-compile
