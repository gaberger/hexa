[package]
name = "hexa-exec"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
hexa-core = { path = "../hexa-core" }
hexa-infer = { path = "../hexa-infer" }
hexa-graph = { path = "../hexa-graph" }
hexa-git = { path = "../hexa-git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
urlencoding = "2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
# Seals are SHA-256 of a test file (ADR-2610221540 §6); already in the workspace via hexa-cli.
sha2 = "0.10"
walkdir = "2"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"

# The sealed spec tests (tests/adr_2611031914_spec.rs) may not be edited, and
# carry two style patterns clippy flags. Allowed here, by name, so
# `clippy --all-targets -D warnings` holds without touching a sealed test.
[lints.clippy]
if_same_then_else = "allow"
collapsible_str_replace = "allow"
